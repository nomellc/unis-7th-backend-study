<html layout:decorate="~{layout}" xmlns:layout="http://www.w3.org/1999/xhtml">
<div layout:fragment="content" class="container my-3">
    <h5 class="my-3 border-bottom pb-2">응원 메시지 목록</h5>
    <table class="table">
        <thead class="table-dark">
        <tr>
            <th>번호</th>
            <th>작성자</th>
            <th>응원 내용</th>
            <th>작성일시</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="cheer, loop : ${paging}">
            <td th:text="${paging.getTotalElements() - (paging.number * paging.size) - loop.index}"></td>
            <td th:text="${cheer.writer}"></td>
            <td th:text="${cheer.content}"></td>
            <td th:text="${#temporals.format(cheer.createDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>
    <form th:action="@{/cheer/create}" method="post" class="my-3">
        <div class="row">
            <div class="col-md-3">
                <input type="text" name="writer" class="form-control" placeholder="작성자 이름">
            </div>
            <div class="col-md-7">
                <input type="text" name="content" class="form-control" placeholder="응원 메시지를 남겨주세요!">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">응원하기</button>
            </div>
        </div>
    </form>
    <div th:if="${!paging.isEmpty()}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${!paging.hasPrevious()} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number - 1}|}">이전</a>
            </li>
            <li class="page-item" th:classappend="${!paging.hasNext()} ? 'disabled'">
                <a class="page-link" th:href="@{|?page=${paging.number + 1}|}">다음</a>
            </li>
        </ul>
    </div>
</div>
</html>
